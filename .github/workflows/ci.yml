name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libjsoncpp-dev \
            libmysqlclient-dev \
            libhiredis-dev \
            redis-tools

      - name: Verify Redis service
        run: redis-cli -h 127.0.0.1 -p 6379 ping | grep -Fx PONG

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  web-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            clients/user-client/package-lock.json
            clients/admin-client/package-lock.json
            websocket-bridge/package-lock.json

      - name: Build user web client
        working-directory: clients/user-client
        run: npm ci && npm run build

      - name: Build admin web client
        working-directory: clients/admin-client
        run: npm ci && npm run build:web

      - name: Test static server and WebSocket bridge
        working-directory: websocket-bridge
        run: npm ci && npm test
